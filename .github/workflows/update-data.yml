name: Update Renderer Data

on:
  schedule:
    # Every Monday at 6 AM UTC
    # Chosen to avoid peak GitHub API hours and to give
    # fresh data for the start of each work week.
    - cron: '0 6 * * 1'

  # Manual trigger — useful for testing or forcing an update
  workflow_dispatch:
    inputs:
      renderer:
        description: 'Optional: update only this renderer slug (leave empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (log changes without writing files)'
        required: false
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false  # Don't cancel — data updates should complete

env:
  # Long-lived branch the refresh proposes its changes on. Reused every run so
  # repeated refreshes update one pull request instead of accumulating dozens.
  DATA_BRANCH: automation/renderer-data-refresh

# Pushing the branch and opening the pull request both need a token that is not
# the automatic GITHUB_TOKEN, because GITHUB_TOKEN cannot do either job here:
#
#   * Opening a pull request with it is governed by "Allow GitHub Actions to
#     create and approve pull requests". That control is greyed out in this
#     repository because the renderscope-dev organization forbids it, so no
#     repository-level change can turn it on.
#   * GitHub also suppresses workflow runs for anything GITHUB_TOKEN pushes, to
#     stop a workflow triggering itself. That is why no CI run has ever attached
#     to the data branch, and why the required status checks could never be
#     satisfied even on the runs where the branch pushed cleanly.
#
# A fine-grained personal access token or GitHub App installation token is
# subject to neither restriction: the pull request opens, and both the branch
# push and the pull request trigger workflows normally.
#
# Set repository secret RS_AUTOMATION_TOKEN, scoped to this repository only:
#
#   Contents:      Read and write   (push the data branch)
#   Pull requests: Read and write   (open and update the pull request)
#
# Without it the run still fetches and pushes the data, then fails at the
# pull-request step with these instructions rather than an opaque error. The
# token is referenced only by the two steps that need it, so the rest of the job
# never sees it.

jobs:
  update-github-stats:
    name: Fetch GitHub Stats & Update Data
    runs-on: ubuntu-latest

    # `contents` to push the branch, `pull-requests` to open the PR.
    # This job must never push to main directly: main is protected, which is
    # why every scheduled run from 2026-03 onward fetched the data correctly
    # and then threw it away at the push step (GH013 rule violation).
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so branch operations work correctly
          fetch-depth: 0
          # Persisted for the branch push further down. Pushing with the
          # automation token is what lets CI run on the data branch at all.
          token: ${{ secrets.RS_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-scripts.txt

      - name: Install script dependencies
        run: pip install -r scripts/requirements-scripts.txt

      - name: Fetch GitHub statistics
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.renderer }}" ]; then
            ARGS="$ARGS --renderer ${{ github.event.inputs.renderer }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/fetch_github_stats.py $ARGS --summary-md "$RUNNER_TEMP/summary.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate updated data
        run: python scripts/validate_data.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/renderers/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected:"
            git diff --stat data/renderers/
          fi

      - name: Push refreshed data to a branch
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # Every commit in this repository is authored by the project or its
          # owner; an automated refresh is no exception. The default
          # "github-actions[bot]" identity put a tool's name in the history.
          git config user.name "RenderScope Contributors"
          git config user.email "ashutoshm1771@gmail.com"

          # Recreate the branch from the current main each run so the pull
          # request always shows only the data diff, never stale commits from
          # an earlier refresh that was never merged.
          git checkout -B "$DATA_BRANCH"
          git add data/renderers/
          git commit -m "data: weekly GitHub stats update

          Automated update via fetch_github_stats.py
          Run: ${{ github.run_id }}"
          git push --force-with-lease origin "$DATA_BRANCH"

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.RS_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          USING_PAT: ${{ secrets.RS_AUTOMATION_TOKEN != '' }}
        run: |
          set -uo pipefail
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Automated refresh of GitHub statistics for the renderer catalog."
            echo
            echo "Generated by \`scripts/fetch_github_stats.py\` in [run ${{ github.run_id }}]($RUN_URL)."
            echo
            if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md"; fi
          } > "$BODY_FILE"

          EXISTING=$(gh pr list --head "$DATA_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file "$BODY_FILE" \
              && echo "Updated existing pull request #$EXISTING." && exit 0
          else
            gh pr create --head "$DATA_BRANCH" --base main \
              --title "data: weekly GitHub stats update" \
              --body-file "$BODY_FILE" \
              && echo "Opened a pull request." && exit 0
          fi

          # The refreshed data is already safely on the branch, so name the
          # cause and the fix rather than failing with an opaque permissions
          # error. The most likely cause is the secret not being set: the
          # automatic GITHUB_TOKEN cannot open pull requests here, and the
          # organization forbids the setting that would allow it.
          echo "::error::Could not open a pull request automatically."
          {
            echo "### Pull request not created"
            echo
            echo "The refreshed data was pushed to \`$DATA_BRANCH\`, but the pull"
            echo "request could not be opened."
            echo
            if [ "$USING_PAT" != "true" ]; then
              echo "This run used the automatic \`GITHUB_TOKEN\`, which is not"
              echo "permitted to create pull requests in this organization."
              echo "Set the \`RS_AUTOMATION_TOKEN\` repository secret to a"
              echo "fine-grained token with **Contents: Read and write** and"
              echo "**Pull requests: Read and write** on this repository."
            else
              echo "\`RS_AUTOMATION_TOKEN\` was used, so check that it has not"
              echo "expired and still grants **Pull requests: Read and write**"
              echo "on this repository."
            fi
            echo
            echo "Open it by hand in the meantime:"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/compare/main...$DATA_BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
