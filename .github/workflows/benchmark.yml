name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: 'Renderer to benchmark (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      scene:
        description: 'Scene to benchmark (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      include_reference:
        description: 'Also generate reference renders (very slow)'
        required: false
        default: false
        type: boolean

jobs:
  benchmark:
    runs-on: self-hosted  # Must be a machine with renderers installed
    timeout-minutes: 1440  # 24 hours max

    # `contents` to push the results branch, `pull-requests` to propose it.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RenderScope Python package
        run: |
          cd python
          pip install -e ".[dev]"

      - name: Install script dependencies
        run: pip install pyyaml rich pillow numpy

      - name: Download scenes (if needed)
        run: python scripts/acquire_scenes.py

      - name: Detect installed renderers
        run: renderscope list

      - name: Run benchmarks
        run: |
          ARGS="--skip-existing"
          if [ "${{ inputs.renderer }}" != "all" ]; then
            for r in $(echo "${{ inputs.renderer }}" | tr ',' ' '); do
              ARGS="$ARGS --renderer $r"
            done
          fi
          if [ "${{ inputs.scene }}" != "all" ]; then
            for s in $(echo "${{ inputs.scene }}" | tr ',' ' '); do
              ARGS="$ARGS --scene $s"
            done
          fi
          python scripts/run_benchmarks.py $ARGS

      - name: Generate reference renders
        if: ${{ inputs.include_reference == true }}
        run: python scripts/generate_reference_renders.py --skip-existing

      - name: Publish catalog records from the raw run records
        # run_benchmarks.py writes raw run records to data/benchmarks/_raw/.
        # This derives the schema-conforming files the web dashboard reads.
        run: python scripts/compute_benchmarks_from_renders.py

      - name: Generate web images
        run: python scripts/generate_web_images.py

      - name: Validate benchmark results
        run: |
          pip install jsonschema
          python scripts/validate_data.py

      - name: Propose results as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch is per-dispatch so concurrent benchmark runs on different
          # renderers or scenes never overwrite one another's results.
          BENCH_BRANCH: automation/benchmark-${{ github.run_id }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks/ logs/benchmarks/
          # Optionally add WebP files if they exist and are small enough
          # --force needed because assets/renders/ is in .gitignore (EXR protection)
          if [ -d "assets/renders" ]; then
            find assets/renders -name "*.webp" -size -1M -exec git add --force {} +
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # main is protected: pushing to it is rejected with GH013, which is
          # what silently discarded every scheduled data refresh for months.
          # Propose the results instead of pushing them.
          git checkout -B "$BENCH_BRANCH"
          git commit -m "bench: benchmark results for ${{ inputs.renderer }} × ${{ inputs.scene }}"
          git push --force-with-lease origin "$BENCH_BRANCH"

          gh pr create --head "$BENCH_BRANCH" --base main \
            --title "bench: results for ${{ inputs.renderer }} × ${{ inputs.scene }}" \
            --body "Benchmark results produced by [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on a self-hosted runner." \
            && exit 0

          echo "::error::Results are on branch $BENCH_BRANCH but the pull request could not be opened."
          echo "${{ github.server_url }}/${{ github.repository }}/compare/main...$BENCH_BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload artifacts
        # Always upload: a benchmark run can take hours, so a validation or
        # commit failure must not throw away the measurements.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            data/benchmarks/
            assets/renders/**/*.webp
            logs/benchmarks/
          retention-days: 90
